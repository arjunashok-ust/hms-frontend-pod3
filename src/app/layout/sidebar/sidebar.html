<div class="sidebar">

    <!-- LOGO -->

    <div class="logo">

        <h2>
            HMS
        </h2>

        <p>
            Hospital Management
        </p>

    </div>

    <!-- MENU -->

    <div class="menu">

        <a *ngFor="let node of nodes" [routerLink]="node.path" routerLinkActive="active">
            <i [class]="getIcon(node.path)"></i>
            <span>{{ node.name }}</span>
        </a>

    </div>

</div>

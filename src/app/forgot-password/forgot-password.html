<div class="main-container">

    <div class="card-wrapper">

        <div class="left-panel">

            <div class="logo">

                <div>
                    <h3>
            CareMatrix
          </h3>

                    <p>
                        HOSPITAL MANAGEMENT
                    </p>

                </div>

            </div>

            <h1>

        Forgot Password

      </h1>

            <p class="subtitle">

                Enter your registered email address. A temporary password will be sent to your email.

            </p>

            <div *ngIf="errorMessage" class="error-message">

                {{ errorMessage }}

            </div>

            <div *ngIf="successMessage" class="success-message">

                {{ successMessage }}

            </div>

            <form #forgotForm="ngForm" (ngSubmit)="onSubmit(forgotForm)" novalidate>

                <label>

                    Email

                </label>

                <div class="input-box" [class.invalid]="emailField.invalid && emailField.touched">

                    <input type="email" name="email" [(ngModel)]="email" #emailField="ngModel" placeholder="Enter your registered email" required email>

                </div>

                <div class="validation-error" *ngIf="emailField.invalid && emailField.touched">

                    <span *ngIf="emailField.errors?.['required']">

            Email is required

          </span>

                    <span *ngIf="emailField.errors?.['email']">

            Enter a valid email

          </span>

                </div>

                <button type="submit">

                    Send Temporary Password

                </button>

            </form>

            <div class="join-section">

                Remember your password?

                <a routerLink="/login">

          Back to Login

        </a>

            </div>

        </div>

        <div class="right-panel">

            <img src="assets/image.jpg" alt="Forgot Password">

        </div>

    </div>

</div>

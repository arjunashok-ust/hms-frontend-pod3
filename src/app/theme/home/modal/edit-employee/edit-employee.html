<div class="ee-overlay">
  <div class="ee-modal">

    <button class="ee-close">
      <a routerLink="/employee">
        <i class="bi bi-x-lg"></i>
      </a>
    </button>

    <div class="ee-header">
      <div class="ee-icon">
        <i class="bi bi-person-lines-fill"></i>
      </div>
      <h2>Update Employee</h2>
    </div>

    <form [formGroup]="updateForm" (ngSubmit)="onSubmit()">

      <div class="ee-grid">

        <div class="ee-group">
          <label>Name</label>
          <input type="text" formControlName="name" />
        </div>

        <div class="ee-group">
          <label>Email</label>
          <input [value]="userData?.email" disabled />
        </div>

        <div class="ee-group">
          <label>Department</label>
          <select formControlName="department">
            <option value="" disabled>Select</option>

            @for (d of departments_data; track d) {
              <option [value]="d.departmentName">
                {{ d.departmentName }}
              </option>
            }
          </select>
        </div>

        <div class="ee-group">
          <label>Designation</label>
          <input type="text" formControlName="designation" />
        </div>

        <div class="ee-group">
          <label>Joining Date</label>
          <input type="date" formControlName="joiningDate" />
        </div>

        <div class="ee-group">
          <label>Consultation Fee</label>
          <input type="number" formControlName="consultationFee" />
        </div>
      </div>

      <div class="ee-slot">
        <label>Time Slots</label>
        <div class="ee-slot-row">

          <select formControlName="startHour">
            <option value="" disabled>Start</option>

            @for (h of hours; track h) {
              <option [value]="h">{{ h }}</option>
            }

          </select>
          <span>to</span>

          <select formControlName="endHour">
            <option value="" disabled>End</option>

            @for (h of hours; track h) {
              <option [value]="h">{{ h }}</option>
            }

          </select>

          <button type="button" (click)="generateTimeSlots()">
            Generate
          </button>
        </div>

        @if (generatedSlots.length > 0) {
          <div class="ee-slots">

            @for (slot of generatedSlots; track slot) {
              <label class="ee-chip">

                <input
                  type="checkbox"
                  [checked]="updateForm.value.availabilitySlots.includes(slot)"
                  (change)="toggleSlot(slot)"
                />

                <span>{{ slot }}</span>
              </label>
            }
          </div>
        }

        @if (updateForm.value.availabilitySlots.length > 0) {
          <div class="ee-selected">

            @for (s of updateForm.value.availabilitySlots; track s) {
              <span class="ee-chip-active">
                {{ s }}
              </span>
            }
          </div>
        }

      </div>
      <div class="ee-actions">

        <button type="button" routerLink="/employee">
          Cancel
        </button>

        <button type="submit" [disabled]="updateForm.invalid">
          Update
        </button>
      </div>

    </form>
  </div>
</div>
